<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Studio — Transformers.js</title>
  <style>
    /* === Style tetap sama persis, tidak ada perubahan === */
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2e3a;
      --text: #e4e6eb;
      --text-muted: #9aa0b0;
      --accent: #6c8cff;
      --accent-hover: #5a7aee;
      --user-bg: #1e2a4a;
      --ai-bg: #1a1d27;
      --danger: #e55;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; white-space: nowrap; }
    .badge {
      font-size: 0.7rem;
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      flex-wrap: wrap;
    }
    select, button, input[type="number"] {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-family: inherit;
    }
    button { cursor: pointer; transition: background 0.15s; }
    button:hover { background: #252936; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 500;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.danger {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
    }
    button.danger:hover { background: rgba(238, 85, 85, 0.1); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 4px 0;
      min-height: 22px;
    }
    #progress-bar {
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
      display: none;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s;
    }
    main { flex: 1; display: flex; overflow: hidden; }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      scroll-behavior: smooth;
    }
    .message {
      max-width: 800px;
      margin: 0 auto 16px;
      padding: 12px 16px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user {
      background: var(--user-bg);
      border-left: 3px solid var(--accent);
    }
    .message.assistant {
      background: var(--ai-bg);
      border: 1px solid var(--border);
    }
    .message.system {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-style: italic;
      text-align: center;
    }
    .message .role-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    #input-area {
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--bg);
    }
    #input-area textarea {
      flex: 1;
      resize: none;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      min-height: 44px;
      max-height: 160px;
      line-height: 1.4;
    }
    #input-area textarea:focus { outline: none; border-color: var(--accent); }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .settings-row label { white-space: nowrap; }
    .settings-row input[type="number"] {
      width: 64px;
      padding: 4px 8px;
      font-size: 0.78rem;
    }
    .hidden { display: none !important; }
    #webgpu-warning {
      background: #3a1a1a;
      border: 1px solid var(--danger);
      color: #fbb;
      padding: 12px 20px;
      font-size: 0.85rem;
      text-align: center;
    }
    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .header-controls { margin-left: 0; width: 100%; }
      #input-area { flex-direction: column; }
      #input-area textarea { width: 100%; }
    }
  </style>
</head>
<body>

  <div id="webgpu-warning" class="hidden">
    ⚠️ Browser ini tidak mendukung <strong>WebGPU</strong>. Transformers.js akan berjalan di CPU (WASM)
    dengan performa lebih lambat. Untuk hasil terbaik gunakan Chrome/Edge 113+.
  </div>

  <header>
    <h1>🧠 AI Studio</h1>
    <span class="badge">Transformers.js</span>
    <div class="header-controls">
      <select id="model-select" disabled>
        <option value="">Memuat model…</option>
      </select>
      <button id="load-btn" class="primary" disabled>Muat Model</button>
      <button id="clear-btn" class="danger">Hapus Chat</button>
    </div>
  </header>

  <div id="status">Mendeteksi WebGPU…</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>

  <main>
    <div id="chat-container"></div>
  </main>

  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Ketik pesan… (Enter kirim, Shift+Enter baris baru)" disabled></textarea>
    <button id="send-btn" class="primary" disabled>Kirim</button>
    <button id="stop-btn" class="danger hidden">Stop</button>
    <div class="settings-row">
      <label for="temp">Temp</label>
      <input type="number" id="temp" value="0.7" min="0" max="2" step="0.1" />
      <label for="max-tokens">Max</label>
      <input type="number" id="max-tokens" value="512" min="64" max="4096" step="64" />
    </div>
  </div>

  <script type="module">
    // ============================================================
    // AI Studio — Transformers.js
    // Library: @huggingface/transformers (ONNX Runtime, WebGPU/WASM)
    // ============================================================

    import {
      pipeline,
      TextStreamer,
      InterruptableStoppingCriteria,
    } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4";

    // ---------- Daftar Model ONNX yang kompatibel ----------
    // dtype: kuantisasi yang direkomendasikan untuk model tersebut
    const MODELS = [
      {
        id: "onnx-community/Qwen2.5-0.5B-Instruct",
        label: "Qwen2.5 0.5B (≈ 300 MB) — cepat, multibahasa",
        dtype: "q4",
      },
      {
        id: "onnx-community/Llama-3.2-1B-Instruct-ONNX",
        label: "Llama 3.2 1B (≈ 800 MB) — chat umum",
        dtype: "q4f16",
      },
      {
        id: "HuggingFaceTB/SmolLM2-135M-Instruct-ONNX",
        label: "SmolLM2 135M (≈ 150 MB) — sangat ringan",
        dtype: "q4f16",
      },
      {
        id: "Xenova/Phi-3.5-mini-instruct",
        label: "Phi 3.5 Mini (≈ 2.4 GB) — instruksi kompleks",
        dtype: "q4",
      },
      {
        id: "onnx-community/gemma-2-2b-jpn-it-onnx",
        label: "Gemma 2 2B (≈ 1.5 GB) — Jepang/multibahasa",
        dtype: "q4f16",
      },
    ];

    // ---------- State ----------
    let generator = null; // pipeline text-generation
    let tokenizer = null; // referensi tokenizer untuk apply_chat_template
    let chatHistory = []; // { role, content }
    let isGenerating = false;
    let currentStoppingCriteria = null;
    let currentModelId = null;

    // ---------- DOM ----------
    const $ = (sel) => document.querySelector(sel);
    const modelSelect = $("#model-select");
    const loadBtn = $("#load-btn");
    const clearBtn = $("#clear-btn");
    const statusEl = $("#status");
    const progressBar = $("#progress-bar");
    const progressFill = $("#progress-fill");
    const chatContainer = $("#chat-container");
    const userInput = $("#user-input");
    const sendBtn = $("#send-btn");
    const stopBtn = $("#stop-btn");
    const tempInput = $("#temp");
    const maxTokensInput = $("#max-tokens");
    const webgpuWarning = $("#webgpu-warning");

    // ---------- UI Helpers (sama seperti sebelumnya) ----------
    function populateModels() {
      modelSelect.innerHTML = MODELS.map(
        (m) => `<option value="${m.id}">${m.label}</option>`
      ).join("");
      modelSelect.disabled = false;
      loadBtn.disabled = false;
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.style.color = isError ? "var(--danger)" : "var(--text-muted)";
    }

    function showProgress(pct) {
      if (pct == null) {
        progressBar.style.display = "none";
        return;
      }
      progressBar.style.display = "block";
      progressFill.style.width = `${Math.min(100, pct * 100)}%`;
    }

    function addMessage(role, content) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      if (role === "system") {
        div.textContent = content;
      } else {
        const label = document.createElement("div");
        label.className = "role-label";
        label.textContent = role === "user" ? "Anda" : "AI";
        const body = document.createElement("div");
        body.textContent = content;
        div.appendChild(label);
        div.appendChild(body);
      }
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    function updateLastAssistantMessage(content) {
      const messages = chatContainer.querySelectorAll(".message.assistant");
      const last = messages[messages.length - 1];
      if (last) {
        const body = last.querySelector("div:last-child");
        if (body) body.textContent = content;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    function setInputEnabled(enabled) {
      userInput.disabled = !enabled;
      sendBtn.disabled = !enabled;
    }

    // ---------- Deteksi WebGPU ----------
    async function checkWebGPU() {
      if (!navigator.gpu) {
        webgpuWarning.classList.remove("hidden");
        setStatus("WebGPU tidak tersedia — Transformers.js akan berjalan di CPU (WASM).", true);
        return false;
      }
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          webgpuWarning.classList.remove("hidden");
          setStatus("WebGPU adapter tidak ditemukan — fallback ke CPU.", true);
          return false;
        }
        setStatus("WebGPU terdeteksi ✓");
        return true;
      } catch (e) {
        webgpuWarning.classList.remove("hidden");
        setStatus("Gagal inisialisasi WebGPU: " + e.message, true);
        return false;
      }
    }

    // ---------- Muat Model (Transformers.js) ----------
    async function loadModel(modelId) {
      // Bersihkan model lama jika ada
      if (generator) {
        try {
          await generator.dispose();
        } catch (_) {}
        generator = null;
        tokenizer = null;
      }

      const modelInfo = MODELS.find((m) => m.id === modelId);
      const dtype = modelInfo ? modelInfo.dtype : "q4";

      setStatus(`Memuat ${modelId}…`);
      loadBtn.disabled = true;
      modelSelect.disabled = true;
      showProgress(0);

      try {
        // Tentukan device: gunakan WebGPU jika tersedia
        const hasWebGPU = await checkWebGPU();
        const device = hasWebGPU ? "webgpu" : undefined; // undefined = default WASM

        generator = await pipeline("text-generation", modelId, {
          device: device,
          dtype: dtype,
          progress_callback: (report) => {
            if (report.status === "progress" && report.progress != null) {
              showProgress(report.progress);
              setStatus(
                `Mengunduh model: ${Math.round(report.progress * 100)}% — ${
                  report.file || ""
                }`
              );
            } else if (report.status === "done") {
              setStatus("Model berhasil diunduh, memuat ke memori…");
            }
          },
        });

        // Simpan referensi tokenizer untuk chat template
        tokenizer = generator.tokenizer;
        currentModelId = modelId;

        setStatus(`Model siap: ${modelId} (${dtype})`, false);
        showProgress(null);
        setInputEnabled(true);
        loadBtn.disabled = false;
        modelSelect.disabled = false;
        userInput.focus();

        addMessage("system", `Model ${modelId} siap. Mulai percakapan.`);
      } catch (err) {
        console.error(err);
        setStatus("Gagal memuat model: " + err.message, true);
        showProgress(null);
        loadBtn.disabled = false;
        modelSelect.disabled = false;
        generator = null;
        tokenizer = null;
        currentModelId = null;
      }
    }

    // ---------- Kirim Pesan (Transformers.js + Streaming) ----------
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || !generator || !tokenizer || isGenerating) return;

      userInput.value = "";
      userInput.style.height = "auto";

      // Tambah pesan user ke UI dan history
      addMessage("user", text);
      chatHistory.push({ role: "user", content: text });

      // Placeholder respons asisten
      addMessage("assistant", "…");
      isGenerating = true;
      setInputEnabled(false);
      stopBtn.classList.remove("hidden");
      sendBtn.classList.add("hidden");

      // Buat stopping criteria yang bisa diinterupsi
      currentStoppingCriteria = new InterruptableStoppingCriteria();

      try {
        // --- Format chat history menggunakan chat template model ---
        // add_generation_prompt: true agar model siap melanjutkan giliran asisten
        const prompt = tokenizer.apply_chat_template(chatHistory, {
          tokenize: false,
          add_generation_prompt: true,
        });

        // --- Streamer untuk menampilkan token secara real-time ---
        let fullResponse = "";
        const streamer = new TextStreamer(tokenizer, {
          skip_prompt: true,
          skip_special_tokens: true,
          callback_function: (token) => {
            fullResponse += token;
            updateLastAssistantMessage(fullResponse);
          },
        });

        // --- Jalankan generasi ---
        await generator(prompt, {
          max_new_tokens: parseInt(maxTokensInput.value) || 512,
          temperature: parseFloat(tempInput.value) || 0.7,
          do_sample: true,
          streamer: streamer,
          stopping_criteria: currentStoppingCriteria,
        });

        // Simpan respons lengkap ke history
        chatHistory.push({ role: "assistant", content: fullResponse });

        if (currentStoppingCriteria.interrupted) {
          setStatus("Generasi dihentikan.");
        } else {
          setStatus("Selesai.");
        }
      } catch (err) {
        console.error(err);
        setStatus("Error: " + err.message, true);
        updateLastAssistantMessage("⚠️ Terjadi kesalahan saat menghasilkan respons.");
      } finally {
        isGenerating = false;
        currentStoppingCriteria = null;
        setInputEnabled(true);
        stopBtn.classList.add("hidden");
        sendBtn.classList.remove("hidden");
        userInput.focus();
      }
    }

    // ---------- Stop Generasi ----------
    function stopGeneration() {
      if (currentStoppingCriteria) {
        currentStoppingCriteria.interrupt();
      }
    }

    // ---------- Hapus Chat ----------
    function clearChat() {
      if (isGenerating) return;
      chatHistory = [];
      chatContainer.innerHTML = "";
      addMessage("system", "Chat dihapus. Mulai percakapan baru.");
      setStatus("Chat dibersihkan.");
    }

    // ---------- Event Listeners ----------
    loadBtn.addEventListener("click", () => {
      const modelId = modelSelect.value;
      if (modelId) loadModel(modelId);
    });

    sendBtn.addEventListener("click", sendMessage);
    stopBtn.addEventListener("click", stopGeneration);
    clearBtn.addEventListener("click", clearChat);

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 160) + "px";
    });

    // ---------- Boot ----------
    (async function init() {
      await checkWebGPU();
      populateModels();
      addMessage(
        "system",
        "Selamat datang di AI Studio (Transformers.js). Pilih model lalu klik “Muat Model”."
      );
    })();
  </script>
</body>
</html>
