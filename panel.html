<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pupuk Indonesia Unified Portal — Final v2</title>
<link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/d/da/Logo_Pupuk_Indonesia_%28Persero%29.png"/>
<style>
  :root{
    --bg:#f4f7f6;--panel:#fff;--text:#1d2b28;--muted:#6b7c78;--border:#dce7e3;
    --primary:#0b7a5c;--blue:#1467b3;--danger:#c0392b;--warn:#d97706;
    --shadow:0 8px 24px rgba(15,47,42,.08);--shadow-lg:0 18px 40px rgba(15,47,42,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  code{font-family:ui-monospace,Menlo,monospace;background:#f0f5f3;padding:1px 6px;border-radius:6px;font-size:12px}
  button{font-family:inherit}
  .app{display:flex;min-height:100vh}
  .sidebar{width:252px;background:linear-gradient(180deg,#0f2f2a,#123d36 60%,#0b2a25);color:#e9f5f1;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{padding:6px 4px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
  .brand-logo{background:#fff;border-radius:10px;padding:8px 12px;display:flex;justify-content:center;margin-bottom:8px}
  .brand-logo img{height:32px;width:auto;max-width:200px;display:block}
  .brand-text{text-align:center}
  .brand-text b{font-size:12px;display:block;color:#cfe7df;font-weight:600;letter-spacing:.03em}
  .brand-text small{display:block;color:#9fc8bb;font-weight:400;font-size:10px}
  .nav a{display:flex;align-items:center;gap:10px;color:#cfe7df;text-decoration:none;padding:10px 12px;border-radius:10px;margin:4px 0;font-size:14px;cursor:pointer;transition:.15s}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.active{background:linear-gradient(90deg,rgba(25,169,116,.35),rgba(25,169,116,.05));color:#fff;box-shadow:inset 2px 0 0 #19a974}
  .nav .count{margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 7px;font-size:11px}
  .sidebar-footer{margin-top:20px;padding:12px;background:rgba(255,255,255,.05);border-radius:12px;font-size:11px;color:#9fc8bb}
  .main{flex:1;min-width:0}
  .topbar{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:20}
  .search{flex:1;max-width:520px;position:relative}
  .search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border);border-radius:10px;background:#f8fbfa;outline:none;font-size:14px}
  .search input:focus{border-color:#19a974;background:#fff;box-shadow:0 0 0 3px rgba(25,169,116,.12)}
  .search span{position:absolute;left:12px;top:9px;color:var(--muted)}
  .top-actions{display:flex;align-items:center;gap:10px;margin-left:auto;position:relative}
  .icon-btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--text);position:relative;font-size:14px;display:flex;align-items:center;gap:6px}
  .icon-btn:hover{background:#f4f7f6}
  .badge-dot{position:absolute;top:4px;right:6px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#19a974,#0b7a5c);color:#fff;display:grid;place-items:center;font-weight:700;cursor:pointer;font-size:12px}
  .dropdown{position:absolute;top:48px;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);width:340px;padding:8px;display:none;z-index:30;max-height:420px;overflow:auto}
  .dropdown.show{display:block}
  .dropdown h4{margin:8px 10px 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .dropdown .item{padding:10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;gap:10px;align-items:flex-start}
  .dropdown .item:hover{background:#f4f7f6}
  .dropdown .item small{color:var(--muted);display:block;font-size:11px;margin-top:2px}
  .dropdown .item.unread{background:#eef9f4}
  .dropdown .item.danger{color:var(--danger)}
  .content{padding:22px}
  .hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#0b7a5c 0%,#1467b3 55%,#7c3aed 100%);color:#fff;border-radius:22px;padding:26px;box-shadow:var(--shadow-lg);display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .hero::before{content:'';position:absolute;top:-90px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
  .hero::after{content:'';position:absolute;bottom:-120px;left:15%;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.22),transparent 70%);pointer-events:none}
  .hero-shape{position:absolute;pointer-events:none;opacity:.5}
  .hero-content{position:relative;z-index:2}
  .hero h1{margin:0 0 6px;font-size:24px;letter-spacing:-.01em}
  .hero p{margin:0 0 12px;color:#d7f2ea;font-size:14px}
  .hero .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.16);padding:5px 12px;border-radius:999px;font-size:12px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15)}
  .hero .btn{background:#fff;color:#0b5e48;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.18);position:relative;z-index:2}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:#fff;border-radius:16px;padding:16px;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--kpi-c,#19a974),transparent)}
  .kpi-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .kpi-value{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
  .kpi-sub{font-size:12px;color:var(--muted)}
  .kpi-spark{position:absolute;bottom:-2px;right:0;width:60%;height:44px;opacity:.55}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px;gap:10px;flex-wrap:wrap}
  .section-title h2{font-size:16px;margin:0}
  .section-title small{color:var(--muted)}
  .section-title a{color:var(--blue);text-decoration:none;font-size:13px;font-weight:600}
  .apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .app-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;position:relative;overflow:hidden}
  .app-card::before{content:'';position:absolute;top:0;right:0;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--app-c,#19a974),transparent 70%);opacity:.12;transform:translate(40px,-40px)}
  .app-card:hover{transform:translateY(-3px);border-color:#b9d9cf;box-shadow:var(--shadow-lg)}
  .app-card .logo{width:44px;height:44px;margin-bottom:12px;display:block}
  .app-card h3{margin:0 0 4px;font-size:15px}
  .app-card p{margin:0;color:var(--muted);font-size:13px;min-height:36px;line-height:1.4}
  .app-meta{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;position:relative;z-index:1}
  .status{display:flex;align-items:center;gap:6px;color:#0b7a5c;font-weight:600}
  .status.warn{color:var(--warn)}
  .status.offline{color:var(--danger)}
  .dot{width:7px;height:7px;border-radius:50%;background:#19a974;display:inline-block}
  .dot.warn{background:var(--warn)}
  .dot.offline{background:var(--danger)}
  .charts-row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px;margin-bottom:14px}
  .chart-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
  .chart-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .chart-title small{color:var(--muted);font-weight:500;font-size:12px}
  .chart-body{min-height:140px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px}
  .legend-item{display:flex;align-items:center;gap:6px}
  .legend-dot{width:8px;height:8px;border-radius:50%}
  .grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
  .panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .activity{list-style:none;margin:0;padding:0}
  .activity li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eef4f2;font-size:13px;align-items:flex-start}
  .activity li:last-child{border-bottom:0}
  .badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#e8f6f1;color:#0b7a5c;font-weight:700;height:fit-content;white-space:nowrap}
  .badge.b-nwbc{background:#e7f0fb;color:#1467b3}
  .badge.b-dof{background:#e8f6f1;color:#0b7a5c}
  .badge.b-sistro{background:#fdf1e0;color:#b45309}
  .badge.b-ppts{background:#f1eaff;color:#6d28d9}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eef4f2;vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:#fafdfb;position:sticky;top:0}
  tr:hover td{background:#fafdfb}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:#e8f6f1;color:#0b7a5c;font-weight:700;white-space:nowrap}
  .pill.warn{background:#fdf1e0;color:#b45309}
  .pill.err{background:#fdecea;color:#c0392b}
  .btn-primary{background:linear-gradient(135deg,#19a974,#0b7a5c);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:13px}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:13px}
  .btn-ghost:hover{background:#f4f7f6}
  .btn-danger{background:#fdecea;color:var(--danger);border:1px solid #fadbd8;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:13px}
  .btn-danger:hover{background:#fbd5d2}
  .btn-sm{padding:5px 9px;font-size:12px;border-radius:7px}
  .btn-icon{background:#f4f7f6;border:1px solid var(--border);border-radius:7px;padding:5px 8px;cursor:pointer;font-size:13px;line-height:1}
  .btn-icon:hover{background:#e8f6f1;border-color:#b9d9cf}
  .btn-icon.del:hover{background:#fdecea;border-color:#fadbd8;color:var(--danger)}
  .actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .toolbar .btn-primary{display:flex;align-items:center;gap:6px}
  .toolbar .spacer{flex:1}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .filters select,.filters input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff}
  .tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
  .tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
  .tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
  .modal{position:fixed;inset:0;background:rgba(8,30,26,.55);display:none;place-items:center;padding:20px;z-index:40;backdrop-filter:blur(4px)}
  .modal.show{display:grid}
  .modal-card{background:#fff;border-radius:20px;max-width:680px;width:100%;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:88vh;overflow:auto}
  .modal-card h3{margin:0 0 6px;font-size:18px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .empty{color:var(--muted);font-size:13px;padding:16px;text-align:center}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
  .form-group textarea{min-height:70px;resize:vertical}
  .form-group .hint{font-size:11px;color:var(--muted);margin-top:4px}
  .toast{position:fixed;bottom:20px;right:20px;background:#0b2a25;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;z-index:100;transform:translateY(20px);opacity:0;transition:.3s;pointer-events:none;max-width:400px}
  .toast.show{transform:translateY(0);opacity:1}
  .toast.err{background:var(--danger)}
  .data-group{margin-bottom:20px}
  .data-group h3{margin:0 0 10px;font-size:14px}
  .data-actions{display:flex;gap:6px;flex-wrap:wrap}
  .data-info{background:#eef9f4;border:1px solid #b9e5d3;border-radius:10px;padding:12px;font-size:12px;color:#0b5e48;margin-bottom:14px;line-height:1.6}
  .data-info code{background:#fff}
  @media(max-width:1200px){.charts-row{grid-template-columns:1fr 1fr}.charts-row>div:nth-child(3){grid-column:span 2}.apps{grid-template-columns:repeat(2,1fr)}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr}.charts-row{grid-template-columns:1fr}.charts-row>div:nth-child(3){grid-column:auto}}
  @media(max-width:760px){.sidebar{display:none}.content{padding:14px}.topbar{padding:0 12px}.apps{grid-template-columns:1fr}.hero{padding:18px}.search{display:none}.kpi-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/d/da/Logo_Pupuk_Indonesia_%28Persero%29.png" alt="Pupuk Indonesia"/>
      </div>
      <div class="brand-text">
        <b>UNIFIED PORTAL</b>
        <small>Build v2.0 · Final</small>
      </div>
    </div>
    <nav class="nav">
      <a class="active" data-view="dashboard">▦ Dashboard</a>
      <a data-view="apps">▤ Aplikasi & Modul</a>
      <a data-view="activity">◷ Aktivitas <span class="count" id="navActivityCount">0</span></a>
      <a data-view="audit">🛡 Audit Log</a>
      <a data-view="admin">⚙ Admin & RBAC</a>
      <a data-view="data">📦 Import / Export</a>
    </nav>
    <div class="sidebar-footer">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span class="dot"></span> Data lokal (localStorage)</div>
      <div style="opacity:.7">CSV + JSON supported</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="search"><span>⌕</span><input id="globalSearch" placeholder="Cari data... (Enter)"/></div>
      <div class="top-actions">
        <button class="icon-btn" id="btnNotif">🔔<span class="badge-dot" id="notifDot"></span></button>
        <button class="icon-btn" id="btnCompany"><span id="companyLabel">Pupuk Indonesia</span> ▾</button>
        <div class="avatar" id="btnProfile">AD</div>
        <div class="dropdown" id="ddNotif"><h4>Notifikasi</h4><div id="notifList"></div></div>
        <div class="dropdown" id="ddCompany"><h4>Perusahaan</h4><div id="companyList"></div></div>
        <div class="dropdown" id="ddProfile">
          <h4>Profil & Data</h4>
          <div class="item"><div><b id="profName">-</b><small id="profRole">-</small><small id="profEmail">-</small></div></div>
          <div class="item" onclick="switchView('data')">📦 <div><b>Import / Export</b><small>CSV & JSON</small></div></div>

</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h3 id="modalTitle">Detail</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Tutup</button>
      <button class="btn-primary" id="modalPrimary" onclick="closeModal()">Lanjutkan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1. STORE
   ============================================================ */
const KEY = "pi-portal-final-v2";
let store = { users:[], companies:[], apps:[], activities:[], auditLogs:[],
              notifications:[], moduleData:{NWBC:[],DOF:[],SISTRO:[],PPTS:[]},
              rbac:[], health:[] };
let currentView = "dashboard";
let currentUser = null;
let currentCompany = null;

function seed(){
  store.companies = [
    {id:"PIHC",  name:"PT Pupuk Indonesia (Persero)",         short:"Pupuk Indonesia"},
    {id:"PIM",   name:"PT Pupuk Iskandar Muda",               short:"PIM"},
    {id:"PUSRI", name:"PT Pupuk Sriwidjaja Palembang",        short:"PUSRI"},
    {id:"PKT",   name:"PT Pupuk Kujang",                      short:"PKT"},
    {id:"PKG",   name:"PT Pupuk Kalimantan Timur",            short:"PKG"},

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const fmt = n => (n||0).toLocaleString("id-ID");
const uid = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const escapeHTML = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, isErr){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr?" err":"");
  clearTimeout(t._to);
  t._to = setTimeout(()=>{ t.className = "toast" + (isErr?" err":""); }, 2600);
}
function closeModal(){ $("#modal").classList.remove("show"); }
function openModal(title, bodyHTML, primaryText, primaryFn){
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = bodyHTML;
  const btn = $("#modalPrimary");
  btn.textContent = primaryText || "Tutup";
  btn.onclick = primaryFn || closeModal;
  $("#modal").classList.add("show");
}
function pill(status){
  const s = (status||"").toLowerCase();
  let cls = "";
  if (s.includes("tolak")||s.includes("cancel")||s.includes("err")||s.includes("suspend")||s.includes("offline")) cls = "err";
  else if (s.includes("menunggu")||s.includes("draft")||s.includes("terlambat")||s.includes("progress")||s.includes("degraded")||s.includes("warn")) cls = "warn";
  return `<span class="pill ${cls}">${status||"-"}</span>`;
}
function sparkline(data, color="#0b7a5c", w=140, h=44){
  if (!data || !data.length) data = [0,0,0];
  const max = Math.max(...data), min = Math.min(...data), range = max-min || 1;
  const pts = data.map((v,i)=>{
    const x = (i/Math.max(1,(data.length-1)))*w;
    const y = h - ((v-min)/range)*(h-10) - 5;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const gid = "spk"+uid();
  return `<svg class="kpi-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${h} ${pts} ${w},${h}" fill="url(#${gid})"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function lineChart(values, labels, color="#0b7a5c", w=420, h=150){
  if (!values || !values.length) return `<div class="empty">Tidak ada data trend</div>`;
  const pad = 14;
  const max = Math.max(...values)*1.1, min = 0, range = max-min || 1;
  const pts = values.map((v,i)=>{
    const x = pad + (i/Math.max(1,values.length-1))*(w-pad*2);
    const y = h - pad - 12 - ((v-min)/range)*(h-pad*2-12);
    return [x,y];
  });
  const line = pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length-1][0]} ${h-pad-12} L${pts[0][0]} ${h-pad-12} Z`;
  const gid = "lc"+uid();
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${[0.25,0.5,0.75,1].map(f=>`<line x1="${pad}" y1="${h-pad-12-f*(h-pad*2-12)}" x2="${w-pad}" y2="${h-pad-12-f*(h-pad*2-12)}" stroke="#eef4f2" stroke-width="1"/>`).join("")}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"/>`).join("")}
    ${labels.map((l,i)=>{
      const x = pad + (i/Math.max(1,labels.length-1))*(w-pad*2);
      return `<text x="${x}" y="${h-2}" text-anchor="middle" font-size="10" fill="#6b7c78">${l}</text>`;
    }).join("")}
  </svg>`;
}
function barChart(data, color="#1467b3", w=340, h=150){
  if (!data || !data.length) return `<div class="empty">Tidak ada data</div>`;
  const max = Math.max(...data.map(d=>d.value)) * 1.15 || 1;
  const pad = 14;
  const gap = (w-pad*2)/data.length;
  const barW = gap*0.55;
  const gid = "bc"+uid();
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}"/><stop offset="100%" stop-color="${color}" stop-opacity=".45"/></linearGradient></defs>
    ${[0.25,0.5,0.75,1].map(f=>`<line x1="${pad}" y1="${h-pad-12-f*(h-pad*2-12)}" x2="${w-pad}" y2="${h-pad-12-f*(h-pad*2-12)}" stroke="#eef4f2" stroke-width="1"/>`).join("")}
    ${data.map((d,i)=>{
      const bh = (d.value/max)*(h-pad*2-12);
      const x = pad + i*gap + (gap-barW)/2;
      const y = h - pad - 12 - bh;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="url(#${gid})" rx="5"/>
        <text x="${x+barW/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="700" fill="#1d2b28">${d.value}</text>
        <text x="${x+barW/2}" y="${h-pad+2}" text-anchor="middle" font-size="10" fill="#6b7c78">${d.label}</text>`;
    }).join("")}
  </svg>`;
}
function donutChart(segments, size=140){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const r = size/2 - 16;
  const c = 2*Math.PI*r;
  let acc = 0;
  const circles = segments.map(s=>{
    const frac = s.value/total;
    const dash = c*frac;
    const offset = c*acc;
    acc += frac;
    return `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.color}" stroke-width="20" stroke-dasharray="${dash.toFixed(2)} ${(c-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
  }).join("");
  return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex-shrink:0">${circles}
      <text x="${size/2}" y="${size/2}" text-anchor="middle" font-size="20" font-weight="800" fill="#1d2b28" dy=".35em">${fmt(total)}</text>
    </svg>
    <div class="legend" style="flex-direction:column;gap:8px;margin:0;flex:1;min-width:120px">
      ${segments.map(s=>`<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${s.label}: <b style="margin-left:auto">${fmt(s.value)}</b></div>`).join("")}
    </div>
  </div>`;
}
function hbar(data){
  if (!data || !data.length) return `<div class="empty">Tidak ada data</div>`;
  const max = Math.max(...data.map(d=>d.value)) || 1;
  return `<div style="display:flex;flex-direction:column;gap:10px">
    ${data.map(d=>`
      <div>
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><b>${d.label}</b><span style="color:var(--muted)">${d.value}</span></div>
        <div style="height:8px;background:#eef4f2;border-radius:999px;overflow:hidden">
          <div style="height:100%;width:${(d.value/max*100).toFixed(1)}%;background:linear-gradient(90deg,${d.color},${d.color}99);border-radius:999px"></div>
        </div>
      </div>`).join("")}
  </div>`;
}
function countBy(arr, key){
  const m = {};
  arr.forEach(x => { const k = x[key] || "(kosong)"; m[k] = (m[k]||0)+1; });
  return Object.entries(m).map(([label,value])=>({label,value}));
}
const PALETTE = ["#0b7a5c","#d97706","#c0392b","#1467b3","#7c3aed","#19a974","#0891b2"];
function colored(arr){ return arr.map((x,i)=>({...x, color: PALETTE[i%PALETTE.length]})); }

/* ============================================================
   4. CSV UTILITIES
   ============================================================ */
function downloadFile(content, filename, mimeType){
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 200);
}

function toCSV(rows, fields){
  const escape = v => {
    if (v === null || v === undefined) return '';
    let s;
    if (Array.isArray(v)) s = v.join(';');
    else if (typeof v === 'boolean') s = v ? 'true' : 'false';
    else s = String(v);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const header = fields.map(f => escape(f.name)).join(',');
  const body = rows.map(row => fields.map(f => escape(row[f.name])).join(',')).join('\r\n');
  return header + '\r\n' + body;
}

function parseCSV(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let cur = [], val = '', inQuotes = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { val += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      val += c; i++; continue;
    }
    if (c === '"') { inQuotes = true; i++; continue; }
    if (c === ',') { cur.push(val); val = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { cur.push(val); rows.push(cur); cur = []; val = ''; i++; continue; }
    val += c; i++;
  }
  if (val !== '' || cur.length) { cur.push(val); rows.push(cur); }
  return rows;
}

function parseFieldValue(raw, field){
  raw = (raw || '').trim();
  if (field.type === 'checkbox') {
    const l = raw.toLowerCase();
    return l === 'true' || l === '1' || l === 'yes' || l === 'ya';
  }
  if (field.type === 'number') return Number(raw) || 0;
  if (field.parse === 'nums') return raw.split(';').map(x => parseFloat(x.trim())).filter(n => !isNaN(n));
  if (field.parse === 'csv') return raw.split(';').map(x => x.trim()).filter(Boolean);
  return raw;
}

function parseCSVImport(text, entity, isModule){
  const parsed = parseCSV(text);
  if (parsed.length < 2) throw new Error("File CSV kosong atau hanya berisi header");
  const headers = parsed[0].map(h => h.trim());
  const fields = isModule ? MODULE_SCHEMAS[entity].fields : SCHEMAS[entity].fields;
  const headerIdx = {};
  headers.forEach((h, i) => { headerIdx[h] = i; });
  const fieldIdx = {};
  fields.forEach(f => {
    if (headerIdx[f.name] !== undefined) fieldIdx[f.name] = headerIdx[f.name];
    else if (headerIdx[f.label] !== undefined) fieldIdx[f.name] = headerIdx[f.label];
    else fieldIdx[f.name] = -1;
  });
  const records = [];
  for (let i = 1; i < parsed.length; i++) {
    const row = parsed[i];
    if (row.every(c => (c||'').trim() === '')) continue;
    const obj = {};
    fields.forEach(f => {
      const idx = fieldIdx[f.name];
      const raw = idx >= 0 ? (row[idx] || '') : '';
      obj[f.name] = parseFieldValue(raw, f);
    });
    if (!isModule && ['users','activities','auditLogs','notifications'].includes(entity) && !obj.id) {
      obj.id = uid();
    }
    records.push(obj);
  }
  return records;
}

function triggerImportCSV(entity, isModule){
  pendingImport = { entity, isModule, stage: 'file' };

  input.value = '';
  input.dataset.entity = entity;
  input.dataset.isModule = isModule ? '1' : '0';
  input.click();

$("#fileCSV").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) { pendingImport = null; return; }
  const entity = e.target.dataset.entity;
  const isModule = e.target.dataset.isModule === '1';
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const records = parseCSVImport(ev.target.result, entity, isModule);
      pendingImport = { entity, isModule, records };
      showImportModal(entity, isModule, records.length, f.name);
    } catch (err) {
      toast("CSV tidak valid: " + err.message, true);
      pendingImport = null;
    }
  };
  reader.readAsText(f, 'UTF-8');
  e.target.value = '';
});

function showImportModal(entity, isModule, count, fileName){
  const label = isModule ? `Data ${entity}` : SCHEMAS[entity].label;
  openModal(`Import CSV: ${label}`,
    `<p>File: <b>${escapeHTML(fileName)}</b></p>
     <p>Ditemukan <b>${count}</b> baris data yang siap diimport.</p>
     <div class="form-group">
       <label>Mode Import</label>
       <select id="importMode">
         <option value="upsert">Upsert — perbarui yang sudah ada, tambah yang baru</option>
         <option value="replace">Replace — ganti semua data entity ini</option>
       </select>
       <div class="hint">Upsert menggunakan field kunci utama (ID/Key). Replace menghapus data lama terlebih dahulu.</div>
     </div>`,
    "Import Sekarang",
    () => {
      const mode = $("#importMode").value;
      applyImport(mode);
    });
}

function applyImport(mode){
  if (!pendingImport) return;
  const { entity, isModule, records } = pendingImport;
  try {
    if (mode === 'replace') {
      if (isModule) store.moduleData[entity] = records;
      else store[entity] = records;
    } else {
      const keyField = isModule ? 'id' : SCHEMAS[entity].key;
      const target = isModule ? store.moduleData[entity] : store[entity];
      const map = new Map(target.map(x => [String(x[keyField]), x]));
      for (const rec of records) {
        const k = String(rec[keyField]);
        if (map.has(k)) Object.assign(map.get(k), rec);
        else { target.push(rec); map.set(k, rec); }
      }
    }
    save();
    if (!isModule && entity === 'users' && !store.users.find(u => u.id === (currentUser||{}).id)) currentUser = store.users[0] || null;
    if (!isModule && entity === 'companies' && !store.companies.find(c => c.id === (currentCompany||{}).id)) currentCompany = store.companies[0] || null;
    closeModal();
    pendingImport = null;
    refreshTop(); renderView();
    toast(`${records.length} baris diimport ke ${isModule ? entity : SCHEMAS[entity].label}`);
  } catch (err) {
    toast("Import gagal: " + err.message, true);
  }
}

   ============================================================ */
function openForm({title, fields, initial={}, onSubmit}){
  const data = JSON.parse(JSON.stringify(initial));
  const formId = "f"+uid();
  const html = `<form id="${formId}" autocomplete="off">
    ${fields.map(f=>{
      const val = data[f.name] !== undefined ? data[f.name] : "";
      let input = "";
      if (f.type === "textarea") input = `<textarea name="${f.name}" ${f.required?'required':''}>${val}</textarea>`;
      else if (f.type === "select") {
        let opts = f.options || [];
        if (f.optionsFn) opts = f.optionsFn().map(o => typeof o === "string" ? {value:o,label:o} : o);
        const cur = Array.isArray(val) ? val.join(",") : val;
        input = `<select name="${f.name}" ${f.required?'required':''}><option value="">— pilih —</option>${opts.map(o=>`<option value="${o.value}" ${o.value===cur?'selected':''}>${o.label}</option>`).join("")}</select>`;
      } else if (f.type === "checkbox") input = `<label style="display:flex;align-items:center;gap:8px;font-weight:500;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)"><input type="checkbox" name="${f.name}" ${val?'checked':''} style="width:auto"/> Ya</label>`;
      else if (f.type === "number") input = `<input type="number" name="${f.name}" value="${val}" ${f.required?'required':''}/>`;
      else { const v = Array.isArray(val) ? val.join(",") : val; input = `<input type="${f.type||'text'}" name="${f.name}" value="${v}" ${f.required?'required':''}/>`; }
      return `<div class="form-group"><label>${f.label}</label>${input}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
    }).join("")}
  </form>`;
  openModal(title, html, "Simpan", () => {
    const form = $("#"+formId);
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const fd = new FormData(form);
    const out = {};
    fields.forEach(f=>{
      let v = fd.get(f.name);
      if (f.type === "checkbox") v = form.querySelector(`[name="${f.name}"]`).checked;
      else if (f.parse === "nums") v = String(v||"").split(",").map(x=>parseFloat(x.trim())).filter(n=>!isNaN(n));
      else if (f.parse === "csv") v = String(v||"").split(",").map(x=>x.trim()).filter(Boolean);
      else if (f.type === "number") v = Number(v)||0;
      out[f.name] = v;
    });
    onSubmit(out); closeModal();
  });
}
function confirmDelete(label, onConfirm){
  openModal("Hapus data?", `<p>Yakin ingin menghapus <b>${label}</b>? Tindakan ini tidak bisa dibatalkan.</p>`, "Hapus",
    () => { onConfirm(); closeModal(); });
}

      save(); renderView(); refreshTop();
      toast(`${s.label} diperbarui`);

   ============================================================ */
function switchView(name){
  currentView = name;
  $$(".nav a").forEach(a => a.classList.toggle("active", a.dataset.view===name));
  renderView();
}
function renderView(){
  if (currentView==="dashboard") renderDashboard();
  else if (currentView==="apps") renderApps();
  else if (currentView==="activity") renderActivity();
  else if (currentView==="audit") renderAudit();
  else if (currentView==="admin") renderAdmin();
  else if (currentView==="data") renderData();
  else renderDashboard();
}
$$(".nav a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); switchView(a.dataset.view); }));

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const {action, entity, key, mod, module} = btn.dataset;
  if (action === "edit")        editEntity(entity, key);
  else if (action === "delete") deleteEntity(entity, key);
  else if (action === "editMod")   editModule(mod, key);
  else if (action === "deleteMod") deleteModule(mod, key);
  else if (action === "exportCSV")  exportCSV(entity, module === '1');
  else if (action === "templateCSV") downloadTemplate(entity, module === '1');
  else if (action === "importCSV")  triggerImportCSV(entity, module === '1');
  else if (action === "exportJSON") exportJSON();
  else if (action === "importJSON") $("#fileJSON").click();
  else if (action === "resetAll")   resetAll();
});

/* ============================================================
   17. GLOBAL SEARCH
   ============================================================ */
$("#globalSearch").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim(); if (!q) return;
  const ql = q.toLowerCase();
  const hits = [];
  store.activities.forEach(a => { if ((a.action+" "+a.user+" "+a.app).toLowerCase().includes(ql))
    hits.push(`<tr><td><span class="badge b-${(a.app||'').toLowerCase()}">${a.app}</span></td><td>${a.action}</td><td><small>${a.user}</small></td></tr>`); });
  Object.entries(store.moduleData).forEach(([k,arr]) => arr.forEach(r => {
    if (JSON.stringify(r).toLowerCase().includes(ql))
      hits.push(`<tr><td><span class="badge b-${k.toLowerCase()}">${k}</span></td><td>${r.title || (r.plat+" · "+r.gudang) || (r.name+" · "+r.wilayah)}</td><td>${pill(r.status)}</td></tr>`);
  }));
  store.users.forEach(u => { if ((u.name+u.email+u.role).toLowerCase().includes(ql))
    hits.push(`<tr><td><span class="badge">USER</span></td><td>${u.name} · ${u.role}</td><td><small>${u.email}</small></td></tr>`); });
  openModal(`Hasil pencarian: "${q}"`,
    hits.length ? `<table><thead><tr><th>Modul</th><th>Ringkasan</th><th>Info</th></tr></thead><tbody>${hits.join("")}</tbody></table>` : `<p>Tidak ada hasil untuk <b>${q}</b>.</p>`,
    "Tutup");
});

/* ============================================================
   18. INIT
   ============================================================ */
load();
if (!store.users.length) seed();
currentUser = store.users[0];
currentCompany = store.companies[0];
refreshTop();
renderView();
</script>
